name: inha-tb
channels: [conda-forge, bioconda]
# Minor-version pins on everything that touches a reported number. Exact versions
# that produced the committed tables are in environment.lock.json.
dependencies:
  - python=3.11.*
  - numpy=2.4.*
  - pandas=3.0.*
  - scipy=1.17.*
  - scikit-learn=1.9.*
  - matplotlib
  - rdkit=2026.03.*
  - openbabel
  - requests
  - reportlab
  - pillow
  - pip
  - pip:
      - vina
      - meeko
      - xgboost==3.2.*
      - prolif
      - MDAnalysis
